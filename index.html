<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>태양계 행성 탐험</title>
  <meta name="description" content="태양계 8개 행성을 소개하는 페이지">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>

  <header class="hero">
    <p class="eyebrow">Solar System</p>
    <h1>태양계 행성 탐험</h1>
    <p class="lead">태양을 도는 여덟 개의 행성을 만나 보세요. 궤도 위의 행성이나 아래 카드를 누르면 자세한 정보가 열려요.</p>

    <div class="orbit-wrap">
      <div id="orbit" class="orbit" aria-label="태양계 궤도 애니메이션">
        <div class="sun" aria-hidden="true"></div>
      </div>
      <div class="orbit-controls">
        <button id="toggleSpin" type="button">⏸ 일시정지</button>
        <label>속도 <input id="speed" type="range" min="0.2" max="5" step="0.1" value="1"></label>
      </div>
      <p class="note">※ 행성 크기와 거리는 실제 비율이 아니에요.</p>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="section-head">
        <h2>행성 둘러보기</h2>
        <div class="filters" role="group" aria-label="행성 분류">
          <button class="filter active" data-filter="all" type="button">전체</button>
          <button class="filter" data-filter="rocky" type="button">암석형</button>
          <button class="filter" data-filter="gas" type="button">가스형</button>
          <button class="filter" data-filter="ice" type="button">얼음형</button>
        </div>
      </div>
      <div id="cards" class="cards"></div>
    </section>

    <section class="section">
      <h2>크기 비교 <small>(지름, 지구 = 1)</small></h2>
      <div id="sizes" class="sizes"></div>
    </section>

    <section class="section">
      <h2>퀴즈 한 판</h2>
      <div class="quiz">
        <p id="quizQ" class="quiz-q"></p>
        <div id="quizA" class="quiz-a"></div>
        <p id="quizResult" class="quiz-result" aria-live="polite"></p>
        <button id="quizNext" type="button">다음 문제</button>
      </div>
    </section>
  </main>

  <dialog id="detail" class="detail">
    <button class="close" type="button" aria-label="닫기">✕</button>
    <div class="detail-body">
      <div id="dPlanet" class="d-planet"></div>
      <div>
        <p id="dEn" class="eyebrow"></p>
        <h3 id="dName"></h3>
        <p id="dDesc"></p>
        <dl id="dStats" class="stats"></dl>
        <p id="dFact" class="fact"></p>
      </div>
    </div>
  </dialog>

  <footer>HTML · CSS · JavaScript로 만든 태양계 소개 페이지</footer>

  <script src="script.js"></script>
</body>
</html>
